---
- hosts: elevate
  become: yes

  vars:
    project_path: /opt/deployment
    current_path: /opt/deployment/commons-backend
    uvicorn_port: 9000
    uvicorn_workers: 4
    uvicorn_tmux_session: sg-commons-uvicorn

  tasks:
    - name: Read Vault token
      slurp:
        src: "{{ project_path }}/.token"
      register: slurpfile

    - name: Create release path
      set_fact:
        release_path: "{{ project_path }}/releases/{{ lookup('pipe','date +%Y%m%d%H%M%S') }}"

    - name: Create release directory
      file:
        path: "{{ release_path }}"
        state: directory
        mode: "0755"

    - name: Clone repository
      git:
        repo: https://github.com/ELEVATE-Project/commons-backend.git
        dest: "{{ release_path }}"
        version: "{{ gitBranch }}"
        clone: yes
        update: yes

    - name: Download application secrets
      shell: >
        curl --silent --insecure
        --location
        --request GET "{{ vaultAddress }}commons-backend"
        --header "X-Vault-Token: {{ slurpfile.content | b64decode | trim }}"
        | jq '.data.data'
        > "{{ release_path }}/data2.json"

    - name: Download GCP credentials
      shell: >
        curl --silent --insecure
        --location
        --request GET "{{ vaultAddress }}commons-backend-gcp-auth"
        --header "X-Vault-Token: {{ slurpfile.content | b64decode | trim }}"
        | jq '.data.data'
        > "{{ release_path }}/client_secret.json"

    - name: Download config secrets
      shell: >
        curl --silent --insecure
        --location
        --request GET "{{ vaultAddress }}commons-gcp-config"
        --header "X-Vault-Token: {{ slurpfile.content | b64decode | trim }}"
        | jq '.data.data'
        > "{{ release_path }}/config/secrets.json"

    - name: Remove current deployment
      file:
        path: "{{ current_path }}"
        state: absent

    - name: Create deployment directory
      file:
        path: "{{ current_path }}"
        state: directory
        mode: "0755"

    - name: Move release into deployment directory
      shell: mv {{ release_path }}/* {{ current_path }}/

    - name: Make json2env executable
      file:
        path: "{{ current_path }}/deployment/json2env.sh"
        mode: "0744"

    - name: Generate .env
      shell: >
        cat {{ current_path }}/data2.json |
        {{ current_path }}/deployment/json2env.sh
        > {{ current_path }}/.env

    - name: Create Python virtual environment
      command: uv venv
      args:
        chdir: "{{ current_path }}"
        creates: "{{ current_path }}/.venv"

    - name: Install dependencies
      shell: uv sync
      args:
        chdir: "{{ current_path }}"

    - name: Install psycopg2-binary
      shell: uv pip install psycopg2-binary
      args:
        chdir: "{{ current_path }}"

    - name: Create logs directory
      file:
        path: "{{ current_path }}/logs"
        state: directory
        mode: "0755"

    - name: Wait for DB host to resolve
      command: getent hosts autoscaling-testing.cle48a6imkp7.ap-south-1.rds.amazonaws.com
      register: dns_check
      retries: 10
      delay: 5
      until: dns_check.rc == 0
      changed_when: false

    - name: Run Django migrations
      shell: |
        export $(cat .env | xargs)
        .venv/bin/python manage.py migrate
      args:
        executable: /bin/bash
        chdir: "{{ current_path }}"
      register: migrate_result
      retries: 5
      delay: 10
      until: migrate_result.rc == 0

    - name: Install Celery service
      template:
        src: templates/sg-commons-celery.service.j2
        dest: /etc/systemd/system/sg-commons-celery.service
        mode: "0644"
      notify:
        - Reload systemd

    - meta: flush_handlers

    - name: Enable Celery
      systemd:
        name: sg-commons-celery
        enabled: yes

    - name: Restart Celery
      systemd:
        name: sg-commons-celery
        state: restarted

    - name: Verify Celery
      command: systemctl is-active sg-commons-celery
      register: celery_status
      changed_when: false
      failed_when: celery_status.stdout != "active"

    - debug:
        var: celery_status.stdout

    - name: Ensure tmux is installed
      package:
        name: tmux
        state: present

    - name: Kill existing Uvicorn tmux session (if any)
      shell: tmux kill-session -t {{ uvicorn_tmux_session }} || true
      changed_when: false

    - name: Pause to let old Uvicorn process release the port
      pause:
        seconds: 2

    - name: Start Uvicorn in tmux session
      shell: >
        tmux new-session -d -s {{ uvicorn_tmux_session }}
        "bash -c 'export \$(cat {{ current_path }}/.env | xargs) &&
        exec {{ current_path }}/.venv/bin/uvicorn
        shikshalokam_mohini.asgi:application
        --host 0.0.0.0
        --port {{ uvicorn_port }}
        2>&1 | tee -a {{ current_path }}/logs/commons.log'"
      args:
        chdir: "{{ current_path }}"
        executable: /bin/bash

    - name: Wait for Uvicorn to come up
      pause:
        seconds: 3

    - name: Verify Uvicorn tmux session is running
      shell: tmux has-session -t {{ uvicorn_tmux_session }}
      register: uvicorn_status
      changed_when: false
      failed_when: uvicorn_status.rc != 0

    - name: Verify Uvicorn is listening on the port
      wait_for:
        host: 127.0.0.1
        port: "{{ uvicorn_port }}"
        timeout: 15
      register: uvicorn_port_check

    - debug:
        msg: "Uvicorn is running in tmux session '{{ uvicorn_tmux_session }}'"

  handlers:
    - name: Reload systemd
      systemd:
        daemon_reload: yes
