---
- hosts: elevate
  vars:
    #contents: "{{ lookup('file', '/opt/rsync/text.txt') }}"
    project_path: /opt/deployment
  tasks:
    - name: Slurp hosts file
      slurp:
        src: "{{ project_path }}/.token"
      register: slurpfile
    #- debug: msg="{{ slurpfile['content'] | b64decode }}"
    #- debug: msg="the value of foo.txt is {{ contents }}"
    
    - name: Create release folder
      set_fact:
        release_path: "{{ project_path }}/releases/{{ lookup('pipe','date +%Y%m%d%H%M%S') }}"
        current_path: "{{ project_path }}/commons-backend"
    
    - name: Retrieve current release folder
      command: readlink -f mentoring
      register: current_release_path
      ignore_errors: yes
      args:
        chdir: "{{ project_path }}"
    - name: Create new folder
      file:
        dest={{ release_path }}
        mode=0755
        recurse=yes
        state=directory
    - name: Clone the repository
      git:
        repo: https://github.com/ELEVATE-Project/commons-backend.git
        dest: "{{ release_path }}"
        clone: yes
        update: yes
        version: "{{ gitBranch }}" 

    - name: Run vault credentials
      shell: "curl --location --request GET '{{ vaultAddress }}commons-backend' --header 'X-Vault-Token: {{ slurpfile['content'] | b64decode }}' | jq '.data.data' > '{{ release_path }}/data2.json'"
      register: credentials
    - debug: 
       var: "{{ credentials }}"

    - name: Get gcp credentials
      shell: "curl --location --request GET '{{ vaultAddress }}commons-backend-gcp-auth' --header 'X-Vault-Token: {{ slurpfile['content'] | b64decode }}' | jq '.data.data' > '{{ release_path }}/client_secret.json'"
      register: vault_response
    - debug: 
       var: "{{ vault_response }}"
      
    - name: Get config.json 
      shell: "curl --location --request GET '{{ vaultAddress }}commons-gcp-config' --header 'X-Vault-Token: {{ slurpfile['content'] | b64decode }}' | jq '.data.data' > '{{ release_path }}/config/secrets.json'"
      register: vault_config_response
    - debug: 
       var: "{{ vault_config_response }}"
      
    - name: Delete Old Folder & create folder
      shell: rm -rf {{ current_path }} &&  cd {{ project_path }} && mkdir commons-backend

    - name: Move code from release  to service folder
      shell: mv "{{ release_path }}"/* {{ current_path }}/
    
    - name: set permission
      shell: chmod 744 {{ current_path }}/deployment/json2env.sh  
      
    - name: generate .env 
      shell: cat {{ current_path }}/data2.json | {{ current_path }}/deployment/json2env.sh > {{ current_path }}/.env
      register: envConfig 
    - debug: msg=" cred {{ envConfig }} "

    # - name: Delete release folder
    #   file:
    #     path: "{{ release_path }}"
    #     state: absent

    
    # Create virtual environment
    - name: Create Python virtual environment
      shell: uv venv
      args:
        chdir: "{{ current_path }}"
    
    # Install project dependencies
    - name: Install project dependencies
      shell: |
        source .venv/bin/activate
        uv sync
      args:
        executable: /bin/bash
        chdir: "{{ current_path }}"
    
    # Install psycopg2-binary
    - name: Install psycopg2-binary
      shell: |
        source .venv/bin/activate
        uv pip install psycopg2-binary
      args:
        executable: /bin/bash
        chdir: "{{ current_path }}"
    
    # Run Django migrations
    - name: Run Django migrations
      shell: |
        source .venv/bin/activate
        export $(grep -v '^#' .env | xargs)
        python3 manage.py migrate
      args:
        executable: /bin/bash
        chdir: "{{ current_path }}"
        
    - name: Stop existing Uvicorn
      shell: pkill -f sg-commons-uvicorn
      ignore_errors: yes
    
    - name: Start Uvicorn
      shell: |
        sudo bash -c 'exec -a sg-commons-uvicorn {{ current_path }}/.venv/bin/uvicorn \
        shikshalokam_mohini.asgi:application \
        --host 0.0.0.0 \
        --port 9000 \
        --workers 4' > {{ current_path }}/commons.log 2>&1 &
      args:
        executable: /bin/bash
    
    - name: Verify Uvicorn process
      shell: pgrep -af sg-commons-uvicorn
      register: uvicorn_status
    
    - debug:
        var: uvicorn_status.stdout_lines
